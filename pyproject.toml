[project]
name = "finance"
version = "0.1.0"
description = "Parse Belgian bank/broker exports into Beancount ledgers"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maurus Cuelenaere", email = "mcuelenaere@gmail.com" }]
dependencies = [
    "openpyxl>=3.1.5",
    "pypdf>=6.21.2",
    "PyYAML>=6.0",
]

[project.urls]
repository = "https://github.com/mcuelenaere/finance"

[project.scripts]
finance = "finance.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
